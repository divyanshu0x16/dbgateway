# Spins up 3 independent Redis instances to act as dbgateway's backend shards.
services:
  redis-shard-1:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  redis-shard-2:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  redis-shard-3:
    image: redis:7-alpine
    ports:
      - "6382:6379"
